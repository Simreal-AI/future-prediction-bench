name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic questions
        run: python -m future_prediction_bench validate examples/questions.fixture.jsonl
      - name: Exercise both tracks with synthetic data
        run: python -m future_prediction_bench demo --output runs/ci-demo
      - name: Build source distribution and wheel
        run: python -m build
      - name: Install and smoke-test the wheel outside the checkout
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          python -I -c "import future_prediction_bench; print(future_prediction_bench.__version__)"
          future-prediction-bench --help
